services:
  host402:
    build: .
    container_name: host402-platform
    restart: unless-stopped
    ports:
      - "4020:4020"
      - "4021:4021"
    environment:
      - PORT=4020
      - MCP_PORT=4021
      - BASE_URL=http://localhost:4020
      - X402_NETWORK=eip155:8453
      - X402_PAY_TO=0x4020402040204020402040204020402040204020
      - STORAGE_DIR=/app/storage/deployments
      - DB_PATH=/app/storage/host402.json
    volumes:
      - ./storage:/app/storage
